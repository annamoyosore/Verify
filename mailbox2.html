<!DOCTYPE html>
<html>
<head>
<title>SMS OTP Inbox</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:16px;
    margin-bottom:15px;
}

.msg{
    background:#0f172a;
    padding:10px;
    margin-top:10px;
    border-left:4px solid #38bdf8;
}

.otp{
    font-size:28px;
    color:#22c55e;
    margin-bottom:10px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:white;
    cursor:pointer;
    margin-top:10px;
    margin-right:5px;
}

button:hover{
    background:#0ea5e9;
}
</style>

</head>

<body>

<div class="container">

    <div class="card">
        <h2>Your Temporary Number</h2>

        <div class="otp" id="tempNumber">Loading...</div>

        <button onclick="copyNumber()">Copy</button>
        <button onclick="generateNumber()">Generate New</button>
    </div>

    <div class="card">
        <h2>Inbox</h2>
        <div id="inbox">Loading messages...</div>
    </div>

</div>

<script>

let currentNumber = null;

// 📞 Generate number (from backend in real system)
async function generateNumber() {

    // If you don't have /api/new-number yet, fallback demo:
    const numbers = [
        "+2341000000001",
        "+2341000000002",
        "+2341000000003"
    ];

    currentNumber = numbers[Math.floor(Math.random() * numbers.length)];

    document.getElementById("tempNumber").innerText = currentNumber;

    loadInbox();

}

// 📋 Copy number
function copyNumber(){
    if(!currentNumber){
        alert("No number yet");
        return;
    }

    navigator.clipboard.writeText(currentNumber);
    alert("Copied: " + currentNumber);
}

// 📩 Load inbox from API
async function loadInbox() {

    if(!currentNumber) return;

    const res = await fetch(`/api/sms?number=${currentNumber}`);
    const data = await res.json();

    const inbox = document.getElementById("inbox");
    inbox.innerHTML = "";

    if(data.length === 0){
        inbox.innerHTML = "<div class='msg'>No messages yet...</div>";
        return;
    }

    data.forEach(msg => {
        const div = document.createElement("div");
        div.className = "msg";

        div.innerHTML = `
            <b>From:</b> ${msg.from}<br/>
            ${msg.body}<br/>
            <small>${new Date(msg.time).toLocaleString()}</small>
        `;

        inbox.appendChild(div);
    });
}

// 🔁 Auto refresh inbox
setInterval(loadInbox, 5000);

// start
generateNumber();

</script>

</body>
</html>    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">
        <h2>📱 Vercel SMS OTP Inbox</h2>
        <button onclick="loadInbox()">Refresh</button>
    </div>

    <div class="card">
        <h3>Latest OTP</h3>
        <div class="otp" id="otp">Waiting...</div>
    </div>

    <div class="card">
        <h3>Messages</h3>
        <div id="inbox"></div>
    </div>

</div>

<script>

function extractOTP(text){
    const match = text.match(/\b\d{4,8}\b/);
    return match ? match[0] : null;
}

async function loadInbox(){

    const res = await fetch("/api/sms");
    const data = await res.json();

    const box = document.getElementById("inbox");
    box.innerHTML = "";

    if(data.length === 0){
        box.innerHTML = "No messages yet";
        return;
    }

    data.forEach(msg => {

        const otp = extractOTP(msg.body);

        if(otp){
            document.getElementById("otp").innerText = otp;
        }

        box.innerHTML += `
            <div class="msg">
                <b>From:</b> ${msg.from}<br>
                ${msg.body}<br>
                <small>${msg.time}</small>
            </div>
        `;
    });
}

setInterval(loadInbox, 5000);

</script>

</body>
</html>
