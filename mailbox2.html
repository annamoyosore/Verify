<!DOCTYPE html>
<html>
<head>
<title>SMS OTP Inbox</title>
<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:20px;
}
.container{
    max-width:800px;
    margin:auto;
}
.card{
    background:#1e293b;
    padding:20px;
    border-radius:16px;
    margin-bottom:15px;
}
.msg{
    background:#0f172a;
    padding:10px;
    margin-top:10px;
    border-left:4px solid #38bdf8;
}
.otp{
    font-size:32px;
    color:#22c55e;
}
button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">
        <h2>📱 Vercel SMS OTP Inbox</h2>
        <button onclick="loadInbox()">Refresh</button>
    </div>

    <div class="card">
        <h3>Latest OTP</h3>
        <div class="otp" id="otp">Waiting...</div>
    </div>

    <div class="card">
        <h3>Messages</h3>
        <div id="inbox"></div>
    </div>

</div>

<script>

function extractOTP(text){
    const match = text.match(/\b\d{4,8}\b/);
    return match ? match[0] : null;
}

async function loadInbox(){

    const res = await fetch("/api/sms");
    const data = await res.json();

    const box = document.getElementById("inbox");
    box.innerHTML = "";

    if(data.length === 0){
        box.innerHTML = "No messages yet";
        return;
    }

    data.forEach(msg => {

        const otp = extractOTP(msg.body);

        if(otp){
            document.getElementById("otp").innerText = otp;
        }

        box.innerHTML += `
            <div class="msg">
                <b>From:</b> ${msg.from}<br>
                ${msg.body}<br>
                <small>${msg.time}</small>
            </div>
        `;
    });
}

setInterval(loadInbox, 5000);

</script>

</body>
</html>
