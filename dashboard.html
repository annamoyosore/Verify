<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Dashboard</h1>
    <div id="accounts"></div>
</div>

<script>
async function loadAccounts() {
    const res = await fetch('/api/listAccounts');
    const accounts = await res.json();
    const container = document.getElementById('accounts');
    container.innerHTML = '';

    accounts.forEach(acc => {
        const div = document.createElement('div');
        div.className = 'account-panel';
        div.innerHTML = `
            <h2>${acc.email}</h2>
            <button onclick="addFilter('${acc.$id}')">Add Filter</button>
            <button onclick="listFilters('${acc.$id}')">List Filters</button>
            <div id="filters-${acc.$id}"></div>
        `;
        container.appendChild(div);
    });
}

async function addFilter(accountId){
    const sender = prompt("Enter sender email to forward:");
    const forwardTo = prompt("Enter verified forwarding email:");

    const res = await fetch('/api/createFilter', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({accountId, sender, forwardTo})
    });
    const data = await res.json();
    alert(data.success ? 'Filter created!' : `Error: ${data.error}`);
}

async function listFilters(accountId){
    const res = await fetch('/api/listFilters', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({accountId})
    });
    const data = await res.json();
    const div = document.getElementById(`filters-${accountId}`);
    div.innerHTML = JSON.stringify(data, null, 2);
}

loadAccounts();
</script>
</body>
</html>
