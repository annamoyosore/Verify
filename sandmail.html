<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sand Temp Mail</title>

<style>
body {
  font-family: Arial;
  background:#0b1220;
  color:white;
  padding:20px;
}
button,input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
.box {
  margin-top:20px;
  background:#111827;
  padding:15px;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>📩 Sand Temp Mail</h2>

<input id="email" placeholder="Click generate email" readonly>

<button onclick="generateEmail()">Generate Email</button>
<button onclick="loadInbox()">Check Inbox</button>

<div id="inbox" class="box">No messages yet</div>

<script>

async function generateEmail() {
  const res = await fetch("https://YOUR-VERCEL-APP.vercel.app/api/generate-email");
  const data = await res.json();

  document.getElementById("email").value = data.email;
}

async function loadInbox() {
  const email = document.getElementById("email").value;
  const inbox = document.getElementById("inbox");

  inbox.innerHTML = "Loading...";

  const res = await fetch(
    "https://YOUR-VERCEL-APP.vercel.app/api/inbox?email=" + email
  );

  const data = await res.json();

  if (!data.messages.length) {
    inbox.innerHTML = "No messages found";
    return;
  }

  inbox.innerHTML = data.messages.map(m => `
    <div style="border-bottom:1px solid #333;padding:10px">
      <b>From:</b> ${m.from}<br>
      <b>Subject:</b> ${m.subject}<br>
      <p>${m.text}</p>
    </div>
  `).join("");
}

</script>

</body>
</html>
