<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SandMail Temp Mail</title>

<style>
body {
    font-family: Arial;
    background:#0b1220;
    color:white;
    padding:20px;
}
.container {
    max-width:600px;
    margin:auto;
}

input, button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
}

button {
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover {
    background:#1d4ed8;
}

.box {
    margin-top:20px;
    background:#111827;
    padding:15px;
    border-radius:10px;
}

.msg {
    border-bottom:1px solid #334155;
    padding:10px 0;
}

.row {
    display:flex;
    gap:10px;
}

.row button {
    width:50%;
}
</style>
</head>

<body>

<div class="container">

<h2>📩 SandMail Temp Mail</h2>

<input id="email" placeholder="Generated email will appear here" readonly>

<div class="row">
<button onclick="generateEmail()">⚡ Generate Email</button>
<button onclick="copyEmail()">📋 Copy</button>
</div>

<button onclick="loadInbox()">📬 Load Inbox</button>

<div id="inbox" class="box">No emails yet</div>

</div>

<script>

// ======================
// ⚡ GENERATE EMAIL
// ======================
async function generateEmail() {
    const inbox = document.getElementById("inbox");
    inbox.innerHTML = "Generating email...";

    try {
        const res = await fetch("/api/inbox", {
            method: "POST"
        });

        const data = await res.json();

        console.log("GENERATE RESPONSE:", data);

        if (!data.email) {
            throw new Error("No email returned");
        }

        const emailInput = document.getElementById("email");

        emailInput.value = data.email;
        emailInput.setAttribute("value", data.email);

        inbox.innerHTML = `✅ Email ready: ${data.email}`;

    } catch (err) {
        console.error(err);
        inbox.innerHTML = "❌ Failed to generate email";
    }
}

// ======================
// 📋 COPY EMAIL
// ======================
function copyEmail() {
    const email = document.getElementById("email").value;

    if (!email) return alert("No email generated");

    navigator.clipboard.writeText(email);
    alert("Copied!");
}

// ======================
// 📬 LOAD INBOX
// ======================
async function loadInbox() {
    const email = document.getElementById("email").value;

    console.log("EMAIL USED:", email);

    if (!email || email.trim() === "") {
        alert("Generate email first");
        return;
    }

    const inbox = document.getElementById("inbox");
    inbox.innerHTML = "Loading inbox...";

    const res = await fetch(`/api/inbox?email=${encodeURIComponent(email)}`);
    const data = await res.json();

    console.log("INBOX RESPONSE:", data);

    if (!data.emails || data.emails.length === 0) {
        inbox.innerHTML = "No emails found";
        return;
    }

    inbox.innerHTML = data.emails.map(m => `
        <div class="msg">
            <b>From:</b> ${m.from}<br>
            <b>Subject:</b> ${m.subject}<br>
            <div>${m.html || ""}</div>
        </div>
    `).join("");
}

</script>

</body>
</html>
