<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SandMail Temp Mail</title>

<style>
body {
    font-family: Arial;
    background: #0b1220;
    color: white;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
}

h2 {
    text-align: center;
    color: #38bdf8;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
}

input {
    background: #111827;
    color: white;
}

button {
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #1d4ed8;
}

.row {
    display: flex;
    gap: 10px;
}

.row button {
    width: 50%;
}

.box {
    margin-top: 20px;
    background: #111827;
    padding: 15px;
    border-radius: 10px;
}

.msg {
    border-bottom: 1px solid #334155;
    padding: 10px 0;
}

.status {
    text-align: center;
    margin-top: 10px;
    color: #fbbf24;
}
</style>
</head>

<body>

<div class="container">

<h2>📩 SandMail Temp Mail</h2>

<input id="email" placeholder="Generated email will appear here" readonly>

<div class="row">
    <button onclick="generateEmail()">⚡ Generate Email</button>
    <button onclick="copyEmail()">📋 Copy</button>
</div>

<button onclick="loadInbox()">📬 Load Inbox</button>

<div id="status" class="status">Idle</div>

<div id="inbox" class="box">No emails yet</div>

</div>

<script>

let currentEmail = "";
let currentEncrypted = "";

// ======================
// ⚡ GENERATE EMAIL
// ======================
async function generateEmail() {

    const inbox = document.getElementById("inbox");
    const status = document.getElementById("status");

    status.innerText = "Generating email...";
    inbox.innerHTML = "";

    try {

        const res = await fetch("/api/inbox", {
            method: "POST"
        });

        const data = await res.json();

        console.log("GENERATE:", data);

        if (!data.email || !data.encrypted) {
            status.innerText = "Failed to generate email";
            inbox.innerHTML = "❌ Error creating inbox";
            return;
        }

        currentEmail = data.email;
        currentEncrypted = data.encrypted;

        document.getElementById("email").value = currentEmail;

        status.innerText = "Email ready";

        inbox.innerHTML = `
            <div class="msg">
                ✅ Inbox created<br>
                Waiting for incoming emails...
            </div>
        `;

    } catch (err) {
        console.error(err);
        status.innerText = "Network error";
    }
}

// ======================
// 📋 COPY EMAIL
// ======================
function copyEmail() {

    if (!currentEmail) {
        alert("Generate email first");
        return;
    }

    navigator.clipboard.writeText(currentEmail);
    alert("Copied!");
}

// ======================
// 📬 LOAD INBOX
// ======================
async function loadInbox() {

    const inbox = document.getElementById("inbox");
    const status = document.getElementById("status");

    if (!currentEncrypted) {
        alert("Generate email first");
        return;
    }

    status.innerText = "Checking inbox...";

    try {

        const res = await fetch(
            `/api/inbox?encrypted=${encodeURIComponent(currentEncrypted)}`
        );

        const data = await res.json();

        console.log("INBOX:", data);

        if (!data.emails || data.emails.length === 0) {
            status.innerText = "No emails yet";
            inbox.innerHTML = `
                <div class="msg">
                    📭 Inbox is empty<br>
                    Waiting for emails...
                </div>
            `;
            return;
        }

        status.innerText = "Emails received";

        inbox.innerHTML = data.emails.map(m => `
            <div class="msg">
                <b>From:</b> ${m.from || "Unknown"}<br>
                <b>Subject:</b> ${m.subject || "No Subject"}<br>
                <div>${m.html || m.text || ""}</div>
            </div>
        `).join("");

    } catch (err) {
        console.error(err);
        status.innerText = "Failed to load inbox";
    }
}

// ======================
// 🔄 AUTO REFRESH
// ======================
setInterval(() => {

    if (currentEncrypted) {
        loadInbox();
    }

}, 8000);

</script>

</body>
</html>
