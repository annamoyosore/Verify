<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Temp Mail (SandMail v1)</title>

<style>
body {
    font-family: Arial;
    background:#0b1220;
    color:white;
    padding:20px;
}
.container { max-width:600px; margin:auto; }

input, button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
}

button {
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover { background:#1d4ed8; }

.box {
    margin-top:20px;
    background:#111827;
    padding:15px;
    border-radius:10px;
}

.msg {
    border-bottom:1px solid #334155;
    padding:10px 0;
}

.row {
    display:flex;
    gap:10px;
}

.row button {
    width:50%;
}
</style>
</head>

<body>

<div class="container">

<h2>📩 SandMail Temp Inbox</h2>

<input id="email" placeholder="Generate email first" readonly>

<div class="row">
<button onclick="generateEmail()">Generate Email</button>
<button onclick="copyEmail()">Copy Email</button>
</div>

<button onclick="loadInbox()">Load Inbox</button>

<div id="inbox" class="box">No messages yet</div>

</div>

<script>

const BASE = "https://verify-one-peach.vercel.app";

// 🔥 CREATE INBOX
async function generateEmail() {
    const inbox = document.getElementById("inbox");
    inbox.innerHTML = "Generating...";

    try {
        const res = await fetch(`${BASE}/api/inbox`, {
            method: "POST"
        });

        const data = await res.json();

        if (!data.email) throw new Error("No email returned");

        document.getElementById("email").value = data.email;

        // store encrypted for future use
        localStorage.setItem("encrypted", data.encrypted);

        inbox.innerHTML = "✅ Email generated";

    } catch (err) {
        console.error(err);
        inbox.innerHTML = "❌ Failed to generate mail";
    }
}

// 📋 COPY EMAIL
function copyEmail() {
    const email = document.getElementById("email").value;
    if (!email) return alert("No email");

    navigator.clipboard.writeText(email);
    alert("Copied!");
}

// 📩 LOAD INBOX
async function loadInbox() {
    const email = document.getElementById("email").value;
    const inbox = document.getElementById("inbox");

    if (!email) {
        inbox.innerHTML = "Generate email first";
        return;
    }

    inbox.innerHTML = "Loading inbox...";

    try {
        const res = await fetch(`${BASE}/api/inbox?email=${encodeURIComponent(email)}`);

        const data = await res.json();

        if (!data.emails || data.emails.length === 0) {
            inbox.innerHTML = "No emails found";
            return;
        }

        let html = "<h3>Inbox</h3>";

        data.emails.forEach(m => {
            html += `
                <div class="msg">
                    <b>From:</b> ${m.from}<br>
                    <b>Subject:</b> ${m.subject}<br>
                    <b>Date:</b> ${m.date}<br>
                    <div>${m.html || ""}</div>
                </div>
            `;
        });

        inbox.innerHTML = html;

    } catch (err) {
        console.error(err);
        inbox.innerHTML = "❌ Error loading inbox";
    }
}

</script>

</body>
</html>
