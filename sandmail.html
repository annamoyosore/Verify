<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SandMail Temp Mail</title>

<style>
body {
    font-family: Arial;
    background: #0b1220;
    color: white;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
}

h2 {
    text-align: center;
    color: #38bdf8;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
}

input {
    background: #111827;
    color: white;
}

button {
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #1d4ed8;
}

.row {
    display: flex;
    gap: 10px;
}

.row button {
    width: 50%;
}

.box {
    margin-top: 20px;
    background: #111827;
    padding: 15px;
    border-radius: 10px;
}

.msg {
    border-bottom: 1px solid #334155;
    padding: 10px 0;
}

.error {
    color: #f87171;
}
</style>
</head>

<body>

<div class="container">

<h2>📩 SandMail Temp Mail</h2>

<input id="email" placeholder="Generated email will appear here" readonly>

<div class="row">
    <button onclick="generateEmail()">⚡ Generate Email</button>
    <button onclick="copyEmail()">📋 Copy</button>
</div>

<button onclick="loadInbox()">📬 Load Inbox</button>

<div id="inbox" class="box">No emails yet</div>

</div>

<script>

let currentEncrypted = "";

// ======================
// ⚡ GENERATE EMAIL
// ======================
async function generateEmail() {

    const inbox = document.getElementById("inbox");
    inbox.innerHTML = "Generating email...";

    try {

        const res = await fetch("/api/inbox", {
            method: "POST"
        });

        const data = await res.json();

        console.log("GENERATE RESPONSE:", data);

        if (!data.email) {
            inbox.innerHTML = `❌ ${data.error || "Failed to generate email"}`;
            return;
        }

        // STORE ENCRYPTED TOKEN
        currentEncrypted = data.encrypted;

        // DISPLAY EMAIL
        document.getElementById("email").value = data.email;

        inbox.innerHTML = `✅ Email ready: ${data.email}`;

    } catch(err) {

        console.error(err);

        inbox.innerHTML = "❌ Network error";
    }
}

// ======================
// 📋 COPY EMAIL
// ======================
function copyEmail() {

    const email = document.getElementById("email").value;

    if (!email) {
        alert("Generate email first");
        return;
    }

    navigator.clipboard.writeText(email);

    alert("Copied!");
}

// ======================
// 📬 LOAD INBOX
// ======================
async function loadInbox() {

    if (!currentEncrypted) {
        alert("Generate email first");
        return;
    }

    const inbox = document.getElementById("inbox");

    inbox.innerHTML = "Loading inbox...";

    try {

        // USE ENCRYPTED TOKEN
        const res = await fetch(
            `/api/inbox?encrypted=${encodeURIComponent(currentEncrypted)}`
        );

        const data = await res.json();

        console.log("INBOX RESPONSE:", data);

        if (!data.emails || data.emails.length === 0) {
            inbox.innerHTML = "No emails found";
            return;
        }

        inbox.innerHTML = data.emails.map(m => `
            <div class="msg">
                <b>From:</b> ${m.from || "Unknown"}<br>
                <b>Subject:</b> ${m.subject || "No Subject"}<br>
                <div>${m.html || ""}</div>
            </div>
        `).join("");

    } catch(err) {

        console.error(err);

        inbox.innerHTML = "❌ Failed loading inbox";
    }
}

</script>
</body>
</html>
